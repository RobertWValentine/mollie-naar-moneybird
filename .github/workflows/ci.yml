name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installeer testgereedschap
        run: pip install pytest ruff
      - name: Lint
        run: ruff check mollie_moneybird_sync tests
      - name: Tests
        run: python -m pytest tests/ -q
