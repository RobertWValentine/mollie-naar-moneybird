[project]
name = "mollie-naar-moneybird"
version = "0.2.0"
description = "Zet Mollie- en PayPal-transacties als bankafschriften in Moneybird"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["tzdata; platform_system != 'Darwin'"]

[project.urls]
Repository = "https://github.com/RobertWValentine/mollie-naar-moneybird"
Changelog = "https://github.com/RobertWValentine/mollie-naar-moneybird/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Expliciet vastgezet, anders hangt de uitkomst af van welke ruff-versie er
# toevallig geinstalleerd wordt.
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # future-import staat bewust boven de docstring
    "E501",  # regellengte staat al op 100 via line-length
]
